name: Publicar LegendAI

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências do app
        run: npm ci

      - name: Instalar dependências do motor
        run: python -m pip install --upgrade pip; python -m pip install -r requirements.txt pyinstaller

      - name: Conferir a versão da release
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$packageVersion" -ne $env:GITHUB_REF_NAME) {
            throw "A tag $env:GITHUB_REF_NAME não corresponde à versão $packageVersion do package.json."
          }

      - name: Preparar recursos offline
        run: python tools\prepare_vendor.py

      - name: Empacotar o motor local
        run: npm run build:engine

      - name: Criar e publicar a release
        run: npm run release:github
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
